{% extends 'base.html' %}

{% block content %}

<section class="writing-page">

    <div class="page-heading">
        <p class="eyebrow">Your little corner</p>

        <h1>Leave a page behind.</h1>

        <p>
            Write about something that happened today,
            a thought you want to remember, or simply
            something you feel like putting into words.
        </p>
    </div>


    <form method="POST" class="post-form">

        <div class="form-group">
            <label for="title">Title</label>

            <input
                type="text"
                id="title"
                name="title"
                placeholder="Give your story a name..."
                required
            >
        </div>


        <div class="form-group">
            <label for="content">Your story</label>

            <textarea
                id="content"
                name="content"
                rows="12"
                placeholder="Start writing here..."
                required
            ></textarea>
        </div>


        <div class="form-actions">

            <a href="{{ url_for('home') }}" class="secondary-button">
                Back to shelf
            </a>

            <button type="submit" class="primary-button">
                Save to the shelf
            </button>

        </div>

    </form>

</section>

{% endblock %}
